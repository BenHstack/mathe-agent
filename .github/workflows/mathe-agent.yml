name: Julia Perfect Numbers Agent
on:
  workflow_dispatch:   # Manueller Start per Klick im Actions-Tab

permissions:
  models: read          # Erlaubt den kostenlosen Zugriff auf GitHub Models
  contents: read

jobs:
  solve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: DeepSeek generiert den Julia-Code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python agent.py

      - name: Julia einrichten
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Generierten Julia-Code ausführen
        run: julia perfect_numbers.jl
