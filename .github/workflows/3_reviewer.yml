name: 3 - Reviewer
on:
  pull_request:
    types: [opened, synchronize, reopened] # <-- reopened hinzugefügt
  workflow_dispatch: # <-- Erlaubt manuellen Start!
    inputs:
      pr_number:
        description: 'Die Nummer des Pull Requests (z.B. 5)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  run-reviewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python agent_reviewer.py
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Dieser Ausdruck sorgt dafür, dass es sowohl beim PR-Event als auch beim manuellen Start funktioniert
          PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
